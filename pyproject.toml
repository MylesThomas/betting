[project]
name = "betting"
version = "0.1.0"
description = "NBA/NFL betting analysis and automation"
requires-python = ">=3.13"
dependencies = [
    # Data Processing
    "pandas>=2.1.4",
    "numpy>=1.26.2",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    
    # Sports Data APIs
    "nba_api>=1.4.1",
    
    # HTTP & API
    "requests>=2.31.0",
    "urllib3>=1.26.0",
    
    # AWS
    "boto3>=1.26.0",
    
    # Configuration & Environment
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    
    # Date/Time
    "python-dateutil>=2.8.2",
    
    # Visualization
    "matplotlib>=3.8.0",
    
    # Streamlit (for dashboard)
    "streamlit>=1.28.0",
    
    # Browser Automation (for betting automation)
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
