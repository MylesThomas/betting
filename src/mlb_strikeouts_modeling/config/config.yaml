strategy_summary: "Edge ≥3%, both dirs, OLS not XGB"

mlb_strikeouts_model:
  model_type: ols_bootstrap
  target: strikeouts

  features:
    numeric:
      - k_roll_career
      - k_roll_c5
      - opp_k_against_season
      - is_home
      - consensus_line
      - over_price_bucket_fine   # v5: 9-tier granular bin of avg American over odds at consensus line
      - under_price_bucket_fine  # v5: 9-tier granular bin of avg American under odds at consensus line
    # novig_prob_over REMOVED (v3): varies per book → raw K projection was book-dependent (nonsensical)
    # consensus_line stays: player-level modal line, same across all books for a given pitcher-game
    # over_price_bucket_fine / under_price_bucket_fine (v5): player-game level, book-independent

  training:
    seasons: [2024, 2025, 2026]
    out_of_sample_folds:
      - test_season: 2025
        train_seasons: [2024]
      - test_season: 2026
        train_seasons: [2024, 2025]
    out_of_sample_rmse: 2.1266  # v5 (Group B: granular price buckets); OLS, 7 features; v4 was 2.1433
    residual_std: 2.1464       # std of full-data training residuals (v5)

  inference:
    shrinkage: 0.0             # mean_adj = line + (1-shrink)*(yhat-line); 0.0 = full model signal
    n_bootstrap: 10000
    rng_seed: 42
    # Chosen strategy (v5): both directions, edge >= 3%, any odds tier, all lines
    #   Beats v4 (5% edge, 7,960 bets, +3.97% ROI) by nearly 2x on ROI
    direction: both
    edge_threshold_under: 0.03     # UNDER primary threshold (lowered from 0.05 in v4)
    edge_threshold_over:  0.03     # OVER primary threshold (lowered from 0.05 in v4)
    edge_threshold_show:  0.02     # show backup bets in email (2–3% edge)
    min_books: 2                   # minimum books to include player
    line_min: 3.5                  # exclude extreme alt lines
    line_max: 6.5
    # Out-of-sample (v5): 7,104 bets · 59.36% WR · +528.97u · +7.45% ROI (2025–2026)
    # In-sample/out-of-sample ratio: 0.99x (nearly identical — well-calibrated, no overfitting)

  s3:
    bucket: the-odds-api-mt
    prefix: mlb/strikeouts_model
    spine_key:     mlb/strikeouts_model/spine/mlb_strikeouts_spine.parquet
    model_key:     mlb/strikeouts_model/model/mlb_strikeouts_model.joblib
    residuals_key: mlb/strikeouts_model/model/mlb_strikeouts_residuals_clean.npy
    settled_key:   mlb/strikeouts_model/settled/settled_bets.parquet

  game_logs:
    bucket: the-odds-api-mt
    prefix: mlb/strikeouts_model/pitcher_gamelogs
    seasons: [2024, 2025, 2026]
