strategy_summary: "UNDER 1.5, dogs, edge ≥5pp"

model:
  type: xgboost_regression
  version: v2
  oof_rmse: 1.7229
  oof_r2_pct: 3.927
  n_samples: 143643
  exclude_doubleheaders: true   # market posts single-game props; DH actuals are summed (data mismatch)
  sklearn_version: "1.7.2"
  xgboost_version: "2.1.4"

  # All player-game-level features — identical across every (bookmaker, line) row
  # for the same player-game. Satisfies Idea 3: y_hat is a single player projection.
  numeric_features:
    - tb_Lcareer
    - tb_L20
    - tb_L10
    - ab_Lcareer
    - hr_Lcareer
    - tb_Lseason
    - min_line      # min of all lines posted for this player on gameday
    - max_line      # max of all lines posted for this player on gameday

  categorical_features: []

  calibration:
    method: C_per_line_logistic     # per-line LogisticRegression(y_hat → P(over))
    production_lines: [0.5, 1.5]   # lines with calibration models in bundle
    # Params (IS):  line=0.5: a=+1.188 b=-1.255 | line=1.5: a=+1.224 b=-2.391

  s3_key: "mlb/total_bases_model/model/mlb_tb_regression_v2.joblib"
  spine_key: "mlb/total_bases_model/spine/mlb_total_bases_spine.parquet"

strategy:
  side: UNDER
  lines: [1.5]            # line=0.5 shows no edge in OOS grid search
  min_bet_edge: 0.05      # green rows in email — actually bet these
  min_track_edge: 0.03    # yellow rows in email — paper track only
  dogs_only: true         # bet only when novig_prob_under < 0.50 (dogs = +odds side)
  min_books: 1
  novig_min: 0.10

  # OOS backtest results (correct payout = under_price - 1):
  #   edge≥5pp, dogs, line=1.5: n=12,323, win%=50.6%, +211.9u, ROI=+1.72%, MDD=185.1 (MDD<units)
  #   edge≥3pp, dogs, line=1.5: n=14,110, win%=50.2%, +47.7u, ROI=+0.34%, MDD=282.9 (MDD>units)

backtest:
  groupby: ["name_norm", "game_date", "bookmaker", "line"]
  edge_col: "edge_under"
  novig_col: "novig_prob_under"
  payout_col: "under_price"

grid_search:
  # OOS (OOF predictions) and IS (full model) grid search run 2026-07-05.
  # Dimensions: edge_threshold × odds_bucket × line_bucket.
  # Payout = under_price - 1 (actual book decimal odds, not novig proxy).
  # S3: mlb/total_bases_model/backtest/mlb_tb_v2_oos_grid.csv
  #     mlb/total_bases_model/backtest/mlb_tb_v2_is_grid.csv
  dimensions:
    edge_threshold: [0.00, 0.01, 0.03, 0.05, 0.07, 0.10, 0.15, 0.20]
    odds_bucket:    ["all", "dogs (+odds)", "favs (-odds)"]   # dogs = novig_under < 0.50
    line_bucket:    ["all_lines", "0.5_only", "1.5_only"]

  # ── OOS results (67 combos, sorted by units_won desc) ────────────────────
  # edge  odds_bucket       line_bucket   n_bets  win%    units    roi    mdd
