strategy_summary: "UNDER 1.5, all odds, edge ≥5pp (raw)"

model:
  type: xgboost_regression
  version: v2
  out_of_sample_rmse: 1.7229
  out_of_sample_r2_pct: 3.927
  n_samples: 143643
  exclude_doubleheaders: true   # market posts single-game props; DH actuals are summed (data mismatch)
  sklearn_version: "1.7.2"
  xgboost_version: "2.1.4"

  # All player-game-level features — identical across every (bookmaker, line) row
  # for the same player-game. Satisfies Idea 3: y_hat is a single player projection.
  numeric_features:
    - tb_Lcareer
    - tb_L20
    - tb_L10
    - ab_Lcareer
    - hr_Lcareer
    - tb_Lseason
    - min_line      # min of all lines posted for this player on gameday
    - max_line      # max of all lines posted for this player on gameday

  categorical_features: []

  calibration:
    method: C_per_line_logistic     # per-line LogisticRegression(y_hat → P(over))
    production_lines: [0.5, 1.5]   # lines with calibration models in bundle
    # Params (IS):  line=0.5: a=+1.188 b=-1.255 | line=1.5: a=+1.224 b=-2.391

  s3_key: "mlb/total_bases_model/model/mlb_tb_regression_v2.joblib"
  spine_key: "mlb/total_bases_model/spine/mlb_total_bases_spine.parquet"

strategy:
  side: UNDER
  lines: [1.5]            # line=0.5 shows no edge in out-of-sample grid search
  min_bet_edge: 0.05      # green rows in email — actually bet these (raw edge)
  min_track_edge: 0.03    # yellow rows in email — paper track only (raw edge)
  dogs_only: false        # all odds — signal is in favorite-priced unders (2026-07-10 raw-edge reanalysis)
  min_books: 1
  novig_min: 0.10

  # Out-of-sample backtest results — raw edge (edge = p_model - raw_prob, payout = under_price - 1):
  #   edge≥5pp raw, all odds, line=1.5: n=10,270, win%=63.3%, +524.7u, ROI=+5.11%, MDD=212.8 ← PRODUCTION
  #   edge≥7pp raw, all odds, line=1.5: n=4,900,  win%=63.2%, +247.4u, ROI=+5.05%, MDD=184.0
  #   edge≥3pp raw, all odds, line=1.5: n=19,583, win%=62.5%, +484.6u, ROI=+2.47%, MDD=372.2
  # Prior novig-edge result (incorrect): edge≥5pp novig, dogs, line=1.5: n=12,323, +211.9u, ROI=+1.72%

backtest:
  groupby: ["name_norm", "game_date", "bookmaker", "line"]
  edge_col: "edge_under"
  novig_col: "novig_prob_under"
  payout_col: "under_price"

grid_search:
  # RAW-EDGE grid search run 2026-07-10 (script: 20260710_grid_search_raw_edge.py).
  # Edge = p_model_under - raw_prob_under  (raw price, not novig-stripped).
  # Payout = under_price - 1 (actual decimal odds — unchanged from original).
  # Dogs filter = raw_prob_under < 0.50 = under_price > 2.0 = true plus-odds.
  # S3: mlb/total_bases_model/backtest/mlb_tb_v2_oos_grid_rawedge.csv
  #     mlb/total_bases_model/backtest/mlb_tb_v2_is_grid_rawedge.csv
  #
  # Prior novig-edge grid (2026-07-05) archived at:
  #   mlb/total_bases_model/backtest/mlb_tb_v2_oos_grid.csv (DO NOT USE — edge metric wrong)
  dimensions:
    edge_threshold: [0.00, 0.01, 0.03, 0.05, 0.07, 0.10, 0.15, 0.20]
    odds_bucket:    ["all", "dogs (+odds)", "favs (-odds)"]   # dogs = raw_prob_under < 0.50
    line_bucket:    ["all_lines", "0.5_only", "1.5_only"]

  # ── Out-of-sample results (2026, top combos by units, raw edge) ──────────
  # edge  odds_bucket       line_bucket   n_bets  win%    units    roi    mdd
  out_of_sample_results:
    - {edge: 0.05, odds: "all",   lines: "1.5",  n: 10270, win_pct: 0.633, units: +524.68, roi: +0.0511, mdd: 212.76}  # ← PRODUCTION
    - {edge: 0.05, odds: "favs",  lines: "1.5",  n:  9827, win_pct: 0.639, units: +491.53, roi: +0.0500, mdd: 183.78}
    - {edge: 0.03, odds: "all",   lines: "1.5",  n: 19583, win_pct: 0.625, units: +484.56, roi: +0.0247, mdd: 372.16}
    - {edge: 0.03, odds: "favs",  lines: "1.5",  n: 19022, win_pct: 0.629, units: +428.65, roi: +0.0225, mdd: 319.05}
    - {edge: 0.07, odds: "favs",  lines: "1.5",  n:  4533, win_pct: 0.634, units: +247.81, roi: +0.0547, mdd: 144.27}
    - {edge: 0.07, odds: "all",   lines: "1.5",  n:  4900, win_pct: 0.621, units: +247.67, roi: +0.0505, mdd: 183.98}
    - {edge: 0.10, odds: "favs",  lines: "1.5",  n:  1303, win_pct: 0.621, units:  +74.84, roi: +0.0574, mdd:  72.78}
    - {edge: 0.10, odds: "all",   lines: "1.5",  n:  1588, win_pct: 0.589, units:  +69.25, roi: +0.0436, mdd:  99.40}
    - {edge: 0.05, odds: "dogs",  lines: "1.5",  n:   443, win_pct: 0.559, units:  +33.15, roi: +0.0748, mdd:  30.54}

  # ── In-sample results (2024+2025, top combos by units, raw edge) ─────────
  # IS/OOS ratio for production strategy: IS +3.42% → OOS +5.11% (1.49x, not overfit pattern)
  in_sample_results:
    - {edge: 0.03, odds: "all",   lines: "1.5",  n:  72854, win_pct: 0.629, units: +2305.24, roi: +0.0316, mdd: 299.68}
    - {edge: 0.03, odds: "favs",  lines: "1.5",  n:  70230, win_pct: 0.634, units: +2119.76, roi: +0.0302, mdd: 271.70}
    - {edge: 0.07, odds: "all",   lines: "1.5",  n:  21938, win_pct: 0.631, units: +1471.97, roi: +0.0671, mdd: 149.24}
    - {edge: 0.05, odds: "all",   lines: "1.5",  n:  41699, win_pct: 0.622, units: +1427.71, roi: +0.0342, mdd: 268.32}  # ← PRODUCTION IS
    - {edge: 0.07, odds: "favs",  lines: "1.5",  n:  20084, win_pct: 0.644, units: +1341.38, roi: +0.0668, mdd: 135.93}
    - {edge: 0.05, odds: "favs",  lines: "1.5",  n:  39471, win_pct: 0.630, units: +1269.97, roi: +0.0322, mdd: 251.26}
    - {edge: 0.10, odds: "all",   lines: "1.5",  n:   7703, win_pct: 0.626, units:  +807.47, roi: +0.1048, mdd:  64.81}
    - {edge: 0.10, odds: "favs",  lines: "1.5",  n:   6251, win_pct: 0.661, units:  +733.52, roi: +0.1173, mdd:  57.36}
