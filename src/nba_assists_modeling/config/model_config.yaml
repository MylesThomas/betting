  # IS/OOS ratio check (full-data OLS on 27,641 rows). All ratios < 5x = no overfitting.
  in_sample_results:
    # strategy                IS_roi   OOS_roi  IS_units  OOS_units  ratio  verdict
    - {label: "edge≥0.10 over", is_roi: 0.0278, oos_roi: 0.0083, is_units: 160.9, oos_units: 39.4,  ratio: 3.3, flag: "Passes"}
    - {label: "edge≥0.15 over", is_roi: 0.0809, oos_roi: 0.0244, is_units: 111.6, oos_units: 29.0,  ratio: 3.3, flag: "Passes — CHOSEN"}
    - {label: "edge≥0.15 both", is_roi: 0.0779, oos_roi: 0.0220, is_units: 109.9, oos_units: 27.0,  ratio: 3.5, flag: "Passes"}
