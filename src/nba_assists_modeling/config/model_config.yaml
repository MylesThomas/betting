strategy_summary: "OVER only, edge ≥15pp"

model:
  type: ols_normal_cdf
  version: v1
  residual_std: 2.1153     # walk-forward OOS range: 2.15–2.23
  n_samples: 27641         # rows with market data across all 3 seasons (full-data IS fit)
  features:
    - min_line             # min posted line across all books
    - max_line             # max posted line across all books
    - ast_roll_20          # rolling 20-game AST avg (season-scoped, shift(1))
  coefficients:
    const:       0.2876
    min_line:    0.4478
    max_line:    0.3403
    ast_roll_20: 0.1833
  # Model is inline (not pickled) — coefficients are hardcoded in run_pipeline.py
  # P(over) = 1 - Normal_CDF((line - yhat) / resid_std)

strategy:
  side: OVER
  odds_bucket: all          # 91.4% of bets are positive-odds dogs (avg +152) by construction
  lines: all
  min_bet_edge: 0.15        # primary bets: highlighted in email
  min_show_edge: 0.10       # backup bets: also shown as context
  # OOS (2 walk-forward folds, 2024-25 + 2025-26): 1,188 bets · 43.1% win · +29.0u · 2.44% ROI · 27.7u MDD
  # IS/OOS ratio: 3.3x — within <5x overfitting threshold

backtest:
  groupby: player_key, game_date
  edge_col: edge_over
  novig_col: novig_prob_over
  payout_col: best_over_odds

s3:
  bucket: the-odds-api-mt
  prefix: nba/assists_model
  spine_key: nba/assists_model/spine/nba_assists_spine.parquet
  settled_key: nba/assists_model/settled/settled_bets.parquet

game_logs:
  bucket: nba-api-mt
  prefix: player_game_logs
  seasons:
    - "2023-24"
    - "2024-25"
    - "2025-26"

grid_search:
  # OLS Normal CDF model — Step 5/6 of research HTML (20260702-nba-player-assists.html)
  # Dimensions: edge_threshold [0, 0.01, 0.03, 0.05, 0.08, 0.10, 0.15, 0.20] × direction [over, under, both]
  # 23 strategies evaluated. Odds computed correctly (profit-space avg, not American mean).
  # Bug note: earlier v5 run showed 50%+ ROI due to arithmetic-mean American odds bug — fixed before Step 5.
  dimensions:
    edge_threshold: [0.00, 0.01, 0.03, 0.05, 0.08, 0.10, 0.15, 0.20]
    direction: [over, under, both]

  # OOS results (2 test seasons: 2024-25, 2025-26). Sorted by units_won descending.
  out_of_sample_results:
    # edge   dir        n       win%    push%   units    roi      avg_profit  mdd
    - {edge: 0.10, dir: over,  n:  4727, win_pct: 0.4735, push_pct: 0.0006, units:  39.43, roi:  0.0083, avg_profit: 1.154, mdd:  59.72, label: "backup"}
