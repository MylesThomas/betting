    - {edge: 0.08, dir: under, n:   313, win_pct: 0.4888, push_pct: 0.0032, units: -13.35, roi: -0.0426, avg_profit: 0.989, mdd:  35.04}
    - {edge: 0.01, dir: under, n:  3923, win_pct: 0.5029, push_pct: 0.0013, units: -22.41, roi: -0.0057, avg_profit: 1.018, mdd:  64.27}
    - {edge: 0.03, dir: under, n:  2291, win_pct: 0.4972, push_pct: 0.0004, units: -23.21, roi: -0.0101, avg_profit: 1.045, mdd:  48.91}
