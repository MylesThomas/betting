strategy_summary: "OVER all odds, edge ≥ 3pp, min_books=1, lines 0.5–99.5"

nfl_rec_yards_model:
  model_type: ols_negbin_hybrid
  negbin_threshold: 20.5   # lines < 20.5 use bootstrap OLS residuals; >= use NegBin CDF
  features:
    numeric:
      - offered_line
      - game_total
      - proj_own_score
      - receiving_yards_L8
      - target_share_L8
      - snap_pct_L8
      - market_under_prob
    categorical:
      - pos_TE              # binary 0/1; 1=TE, 0=WR
    order:                  # must match the order StandardScaler was fit on in train.py
      - offered_line
      - game_total
      - proj_own_score
      - receiving_yards_L8
      - target_share_L8
      - snap_pct_L8
      - pos_TE
      - market_under_prob
  inference:
    direction: OVER
    edge_threshold: 0.03
    odds_bucket: all          # all three buckets (plus/even/minus) are profitable OOS; keep volume
    shrinkage: 0.0            # no benefit to shrinkage; hurts ROI
    line_min: 0.5
    line_max: 99.5
    min_books: 1              # mb=1 gives more volume at higher ROI than mb=3
    # Out-of-sample (2023–2025, true temporal walk-forward): 4,978 bets · 57.0% WR · +344.4u · +6.92% ROI
    # In-sample (full-data model):                           3,600 bets · 59.9% WR · +433.3u · +12.04% ROI
    # IS/OOS ratio: 1.74x

  grid_search:
    edge_threshold:    [0.0, 0.01, 0.03, 0.05, 0.10, 0.15, 0.20]
    direction:         ["OVER", "UNDER", "BOTH"]
    odds_bucket:       ["all", "plus_odds", "minus_odds"]  # novig market_over_prob: plus=<0.50 (OVER dog), minus=>0.50 (OVER fav)
    shrinkage:         [0.0, 0.25, 0.50, 0.75]            # pulls ols_pred/nb_mu toward population mean; 0=no shrinkage
    prediction_method: ["model", "consensus_line"]         # model=ML yhat; consensus_line=mean offered_line across books
    min_books:         [1, 3, 5]
    line_min:          [0.5, 20.5]
    line_max:          [99.5]
  # ── Out-of-sample results (OVER, line_min=0.5, n_bets>0, sorted by units_won desc) ──
  # method  shrink  edge  odds_bucket  mb  n_bets  win_pct  units  roi  mdd
