    viz_filename: "nba_futures_vig_single.png"
    logo_source: "espn_cdn"
    logo_height: 21
    
    # Vig color gradient settings (basketball has higher vig)
    vig_color_domain_min: 0.0
    vig_color_domain_max: 10.0
    
    output_width: 1600
    output_height: 2844
    
