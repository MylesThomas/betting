# Shared visualization settings
visualization:
  # Typography
  font_family: "Arial"
  title_font_size: 28
  subtitle_font_size: 16
  header_font_size: 14
  body_font_size: 13
  footer_font_size: 11
  
  # Spacing
  heading_padding_px: 3 # For tight spacing between title and subtitle
  header_padding_px: 8
  data_row_padding_px: 1
  
  # Column widths (pixels)
  col_width_rank: 50
  col_width_team: 200
  col_width_logo: 45
  col_width_record: 70
  col_width_preseason: 95
  col_width_preseason_implied: 115
  col_width_last_week: 95
  col_width_last_week_implied: 115
  col_width_current: 85
  col_width_current_implied: 105
  col_width_fair_odds: 90
  col_width_fair_pct: 70
  col_width_diff_preseason: 120
  col_width_diff_last_week: 120
  col_width_avg_odds: 90
  col_width_implied_pct: 90
  col_width_vig_pct: 120
  col_width_best_book: 110
  col_width_best_odds: 90
  col_width_best_vig_pct: 100
  
  # Color palette (green -> white -> red for vig)
  vig_color_palette:
    - "#90EE90"  # Light green (low vig)
    - "#ffffff"  # White (medium)
    - "#ffcccc"  # Light red
    - "#ff9999"  # Medium red
    - "#d62728"  # Dark red (high vig)
  
  # Difference column color palette (red -> white -> green)
  # Red = negative change (worsened), Green = positive change (improved)
  diff_color_palette:
    - "#d62728"   # Dark red (large negative)
    - "#ffcccc"   # Light red
    - "#ffffff"   # White (no change)
    - "#90EE90"   # Light green
    - "#4CAF50"   # Dark green (large positive)
  
  # Negative vig color (bettor advantage)
  negative_vig_color: "#FFEB3B"  # Yellow
  
  # Twitter handle
  twitter_handle: "@TQSLabs"

# Player headshots configuration
# For player-specific visualizations (MVP odds, player props, etc.)
headshots:
  # Best practices for sharp headshots:
  # 1. Download at FULL RESOLUTION - do NOT thumbnail in Python
  # 2. Convert directly to base64 without resizing
  # 3. Let R/gtExtras handle scaling for maximum sharpness
  # 4. Smaller display size (20-25px) = sharper appearance
  
  # NBA players
  nba:
    source: "nba_cdn_1040x760"
    url_pattern: "https://cdn.nba.com/headshots/nba/latest/1040x760/{player_id}.png"
    resolution: "1040x760"
    display_height_px: 25
    col_width_px: 45
    notes: "1040x760 is highest quality NBA source (100% success rate, 790K pixels)"
  
  # NFL players (if needed in future)
  nfl:
    source: "espn_full"
    url_pattern: "https://a.espncdn.com/i/headshots/nfl/players/full/{player_id}.png"
    notes: "ESPN is primary source for NFL player headshots"
  
  # NCAAB players (if needed in future)
  ncaab:
    notes: "College player headshots vary by source - test before implementing"
  
  # NCAAF players (if needed in future)
  ncaaf:
    notes: "College player headshots vary by source - test before implementing"
