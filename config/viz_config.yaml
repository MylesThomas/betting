# Championship Futures Visualization Configuration
# Settings for NFL, NBA, NCAAF, NCAAB futures visualization

sports:
  nfl:
    display_name: "NFL"
    full_name: "NFL Super Bowl"
    emoji: "🏈"
    
    # Data paths
    input_dir: "data/01_input/the-odds-api/nfl/futures"
    output_dir: "data/04_output/nfl"
    viz_dir: "content/viz/nfl"
    file_prefix: "nfl_super_bowl_futures"
    output_prefix: "nfl_championship"
    
    # Visualization settings
    title: "NFL Super Bowl Futures: True Odds vs. What Books Charge"
    viz_filename: "nfl_futures_vig_single.png"
    logo_source: "espn_cdn"
    logo_height: 21
    
    # Vig color gradient settings (football has lower vig)
    vig_color_domain_min: 0.0
    vig_color_domain_max: 5.0
    
    # Table dimensions (portrait 9:16 for social media)
    output_width: 1600
    output_height: 2844
    
