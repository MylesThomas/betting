# ESPN API season configuration
# Note: ESPN uses different year conventions per sport
# - NFL/NCAAF: year season STARTS (Sept 2025 → Jan 2026 = season 2025)
# - NBA/NCAAB: year season ENDS (Oct 2025 → June 2026 = season 2026)
# TODO 2027: Update season values for 2026-27 season
espn_seasons:
  nfl: 2025      # 2025-26 NFL season
  nba: 2026      # 2025-26 NBA season
  ncaab: 2026    # 2025-26 NCAAB season
  ncaaf: 2025    # 2025-26 NCAAF season (CFP playoff teams only)

# The Odds API configuration
odds_api:
  base_url: https://api.the-odds-api.com/v4
  endpoints:
    # Forward looking (current/upcoming)
    sports: /sports
    odds: /sports/{sport}/odds
    events: /sports/{sport}/events
    event_odds: /sports/{sport}/events/{event_id}/odds
    
    # Backward looking (historical)
    historical_events: /historical/sports/{sport}/events
    historical_odds: /historical/sports/{sport}/events/{event_id}/odds
  
  # Common parameters
  default_params:
    regions: us
    oddsFormat: american
    dateFormat: iso
  
  # Markets
  markets:
    game_lines: [h2h, spreads, totals]  # Moneyline, spreads, totals
    player_props: [player_points, player_rebounds, player_assists, player_threes, player_blocks, player_steals] # can add double-double, triple-double, points+rebounds+assists

# AWS S3 bucket configuration
aws:
  buckets:
    odds_api: the-odds-api-mt      # Historical odds/props from The Odds API
    nba_api: nba-api-mt             # NBA stats, game logs, shot charts from NBA API
    nba_betting: nba-betting-mt     # Betting strategies, plays, results, analysis output

data_directories:
  repo_dir_absolute: /Users/thomasmyles/dev/betting
  data_dir_relative: data
  
  # Organized data folder structure
  input: data/01_input
  cache: data/02_cache
  intermediate: data/03_intermediate
  output: data/04_output
  temp: data/99_tmp
  
  # Input subdirectories (source/reference data)
  input_nba_calendar: data/01_input/nba_calendar
  input_nba_api: data/01_input/nba_api
  input_nba_api_historical: data/01_input/nba_api/historical
  input_odds_api: data/01_input/the-odds-api
  input_odds_api_historical: data/01_input/the-odds-api/historical_props
  
  # Output subdirectories (final results)
  output_nba_arbs: data/04_output/nba/arbs
  input_nba_all_markets: data/01_input/the-odds-api/nba/all_markets

# Commonly used file paths
files:
  # Input files
  nba_calendar_all_games: data/01_input/nba_calendar/all_games_2024_25.csv
  nba_calendar_daily_summary: data/01_input/nba_calendar/daily_summary_2024_25.csv
  nba_calendar_game_dates: data/01_input/nba_calendar/game_dates_2024_25.json
  
  # Cache files
  nba_full_roster_cache: data/02_cache/nba_full_roster_cache.csv
  player_team_cache: data/02_cache/player_team_cache.csv
  
  # Analysis/intermediate files
  nba_game_results_current: data/03_intermediate/nba_game_results_2024_25.csv
  consensus_props: data/03_intermediate/consensus_props_with_game_results_2024_25.csv
  props_with_results: data/03_intermediate/props_with_game_results_2024_25.csv