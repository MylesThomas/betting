# Copy to config/nba_rebounds_prod.yaml and fill S3/email as needed (gitignore secrets there if required).
#
# Champion spec: B_min_max 6 features (see src/nba_rebounds_modeling/rebounds_feature_spec.py).

feature_columns:
  - min_line
  - max_line
  - spread_signed
  - roll_reb_mean_60
  - roll_fg3a_mean_20
  - roll_reb_std_5

target: REB
group_keys:
  - season
  - date
  - player_normalized
  - game_id

sigma_column: roll_reb_std_5
sigma_floor: 0.25
prod_shrink: 0.0
prod_min_edge: 0.05
side_policy: under_only

# Training: all rows in feat parquet with date <= train_end_date (ISO YYYY-MM-DD) if set; else all rows.
train_end_date: null

# Optional uploads (requires AWS creds in env or profile)
s3_bucket: nba-betting-mt
s3_models_prefix: rebounds/models
s3_runs_prefix: rebounds/daily_runs
feature_universe_s3_uri: s3://nba-betting-mt/rebounds/features/rebounds_feature_universe.parquet
feature_universe_season: "*"
feature_build_cache_dir: /ABSOLUTE/PATH/rebounds_cache
input_universe_s3_uri: s3://nba-betting-mt/rebounds/input/rebounds_input_universe.parquet

# Optional: SNS topic for prod_notify_rebounds_sns.py
sns_topic_arn: null

# Daily pipeline orchestration (`scripts/run_rebounds_daily_pipeline.py`)
# Full feature parquet used for freshness check + slicing + optional training
full_feature_parquet: /ABSOLUTE/PATH/rebounds_model_features.parquet
# Props scoring-input parquet for the slate date (historical or scorer-input builder output)
props_input_path: /ABSOLUTE/PATH/rebounds_props_scoring_input.parquet
# Root where daily run artifacts are written
daily_runs_root: /ABSOLUTE/PATH/rebounds_daily_runs
# Prod policy: retrain models each daily run before scoring
retrain_daily: true
# Guardrails
max_feature_lag_days: 1
max_model_age_days: 7
# Optional score override (null => use manifest prod_min_edge)
prod_min_edge_override: null
# Optional scored parquet upload via scorer --s3-uri
scored_s3_uri: null
# Run notify step at end of pipeline
notify_enabled: true
# When date-slice has 0 rows pregame, build fallback feature slice using
# latest historical player form + same-day props market context.
enable_pregame_feature_backfill: true

# Optional one-command live props ingestion + scorer-input build.
# When true, runner ignores `props_input_path` and builds props input for --slate-date.
build_props_scoring_input_from_live: true
live_fetch_to_s3: true
