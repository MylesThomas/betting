    input_dir: "data/01_input/the-odds-api/nfl/futures"
    output_dir: "data/04_output/nfl"
    viz_dir: "content/viz/nfl"
    file_prefix: "nfl_super_bowl_futures"
    output_prefix: "nfl_championship"
    
    # S3 paths
