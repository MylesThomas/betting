      - intermediate_dir: "data/03_intermediate/"
      - output_dir: "data/04_output/"
    
    title: "NCAAB Championship Futures: Preseason to Now"
    viz_filename: "ncaab_futures_vig_single.png"
    logo_source: "local"
    logo_height: 30
    
    footer_note_3: "March Madness futures — only teams with championship odds shown."
    
    # Table dimensions (portrait 9:16 for social media)
    output_width: 1600
    output_height: 2844  # 1600 * (16/9) = portrait ratio
    
    # Historical odds: Now stored in S3 and passed via CLI arguments
    # Preseason: s3://the-odds-api-mt/ncaab/futures/preseason_2025-26.csv
    # Weekly fetches: s3://the-odds-api-mt/ncaab/futures/YYYY-MM-DD/*.csv

# Shared visualization settings
visualization:
  # Typography
  font_family: "Arial"
  title_font_size: 28
  subtitle_font_size: 16
  header_font_size: 14
  body_font_size: 13
  footer_font_size: 11
  
  # Spacing
  heading_padding_px: 3  # Tight spacing between title and subtitle
  header_padding_px: 8
  data_row_padding_px: 1
  
  # Column widths (pixels)
  col_width_rank: 50
  col_width_team: 200
  col_width_logo: 45
  col_width_record: 70
  col_width_preseason: 95
  col_width_preseason_implied: 115
  col_width_last_week: 95
  col_width_last_week_implied: 115
  col_width_current: 85
  col_width_current_implied: 105
  col_width_fair_odds: 90
  col_width_fair_pct: 70
  col_width_diff_preseason: 135
  col_width_diff_last_week: 135
  col_width_avg_odds: 90
  col_width_implied_pct: 90
  col_width_vig_pct: 75
  col_width_best_book: 110
  col_width_best_odds: 90
  col_width_best_vig_pct: 100
  
  # Color palette (green -> white -> red for vig)
  vig_color_palette:
    - "#90EE90"  # Light green (low vig)
    - "#ffffff"  # White (medium)
    - "#ffcccc"  # Light red
    - "#ff9999"  # Medium red
    - "#d62728"  # Dark red (high vig)
  
  # Difference column color palette (red -> white -> green)
  # Red = negative change (worsened), Green = positive change (improved)
  diff_color_palette:
    - "#d62728"   # Dark red (large negative)
    - "#ffcccc"   # Light red
    - "#ffffff"   # White (no change)
    - "#90EE90"   # Light green
    - "#4CAF50"   # Dark green (large positive)
  
  # Vig color domain (for gradient mapping)
  vig_color_domain_min: 0.0
  vig_color_domain_max: 10.0
  
  # Negative vig color (bettor advantage)
  negative_vig_color: "#FFEB3B"  # Yellow
  
  # Footer notes (shared across all sports)
  footer_note_1: "'Implied %' includes bookmaker vig. 'Fair %' is the true probability with vig removed (fair probabilities sum to exactly 100%)."
  footer_note_2: "Color indicates vig level: green = low vig, red = high vig, yellow = negative vig (bettor advantage)."
  
  # Twitter handle
  twitter_handle: "@TQSLabs"

