# Championship Futures Configuration
# Configuration for NFL, NBA, NCAAF, NCAAB futures analysis and visualization
#
# NOTE: This config now only stores visualization settings and file paths.
# Historical odds data (preseason, last week, current) are stored in S3 and 
# passed as CLI arguments to analyze_futures.py
#
# Example workflow:
#   1. Fetch: python3 scripts/fetch_championship_futures.py
#   2. Analyze: python3 analysis/analyze_futures.py --sport nba --top-n 20 \
#               --preseason s3://path/to/preseason.csv \
#               --last-week s3://path/to/last-week.csv \
#               --this-week s3://path/to/this-week.csv
#   3. Visualize: python3 analysis/viz_futures.py --sport nba

# Global settings
save_locally: false  # Set to false to skip local saves (S3 only)
s3_bucket_base: "the-odds-api-mt"  # Base S3 bucket for input data from The Odds API

sports:
  nfl:
    display_name: "NFL"
    full_name: "NFL Super Bowl"
    emoji: "🏈"
    
    # Data paths
    input_dir: "data/01_input/the-odds-api/nfl/futures"
    output_dir: "data/04_output/nfl"
    viz_dir: "content/viz/nfl"
    file_prefix: "nfl_super_bowl_futures"
    output_prefix: "nfl_championship"
    
    # S3 paths
    s3_output_bucket: "nfl-betting-mt"
    s3_analysis_path: "analysis"
    s3_viz_path: "viz"
    s3_data_paths:
      - input_dir: "data/01_input/"
      - cache_dir: "data/02_cache/"
      - intermediate_dir: "data/03_intermediate/"
      - output_dir: "data/04_output/"
  
    # Visualization settings
    title: "NFL Super Bowl Futures: True Odds vs. What Books Charge"
    viz_filename: "nfl_futures_vig_single.png"
    logo_source: "espn_cdn"  # Uses ESPN CDN URLs
    logo_height: 21
    
    # Sport-specific notes
    footer_note_3: "19 of 32 teams have odds available — bookmakers no longer offer odds on eliminated/longshot teams."
    
    # Table dimensions (portrait 9:16 for social media)
    output_width: 1600
    output_height: 2844  # 1600 * (16/9) = portrait ratio
    
  nba:
    display_name: "NBA"
    full_name: "NBA Championship"
    emoji: "🏀"
    
    input_dir: "data/01_input/the-odds-api/nba/futures"
    output_dir: "data/04_output/nba"
    viz_dir: "content/viz/nba"
    file_prefix: "nba_championship_futures"
    output_prefix: "nba_championship"
    
    # S3 paths
    s3_output_bucket: "nba-betting-mt"
    s3_analysis_path: "analysis"
    s3_viz_path: "viz"
    s3_data_paths:
      - input_dir: "data/01_input/"
      - cache_dir: "data/02_cache/"
      - intermediate_dir: "data/03_intermediate/"
      - output_dir: "data/04_output/"
    
    title: "NBA Championship Futures: Preseason to Now"
    viz_filename: "nba_futures_vig_single.png"
    logo_source: "espn_cdn"
    logo_height: 30
    
    footer_note_3: "All 30 NBA teams shown — some may have very long odds due to poor season performance."
    
    # Table dimensions (portrait 9:16 for social media)
    output_width: 1600
    output_height: 2844  # 1600 * (16/9) = portrait ratio
    
    # Historical odds: Now stored in S3 and passed via CLI arguments
    # Preseason: s3://the-odds-api-mt/nba/futures/preseason_2025-26.csv
    # Weekly fetches: s3://the-odds-api-mt/nba/futures/YYYY-MM-DD/*.csv
    
  ncaaf:
    display_name: "NCAAF"
    full_name: "NCAAF Championship"
    emoji: "🏈"
    
