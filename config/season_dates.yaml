# Notes:
# - NBA: Regular season is ~82 games (Oct-April), followed by play-in tournament (2 days), 
#        then playoffs (April-June). Finals are best-of-7.
# - NFL: 18-week regular season (Sept-Jan), followed by Wild Card, Divisional, Conference 
#        Championships, and Super Bowl (early Feb).
# - NCAAB: Season starts early Nov, conference tournaments in March, NCAA Tournament 
#          (March Madness) is 3 weeks in March-April.
# - NCAAF: Season starts late Aug (Week 0), regular season through early Dec, 
#          bowl games and CFP in Dec-Jan. Now 12-team playoff format (since 2024).

